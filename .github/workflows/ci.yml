name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, matching every other repo in the suite. Without this block a
# job inherits the repository default, which can be write-all -- so a compromised
# dependency in `npm ci` would run with a token that can push. This workflow only
# ever reads the checkout. (CodeQL actions/missing-workflow-permissions #1; this
# repo was hand-written after the standard CI rollout, which is why it was the
# only one of 58 missing it.)
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
